<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KFC Colombo — Google Reviews</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/kfc.css">
</head>

<body>

    <main>

        <!-- =========================================
             GOOGLE REVIEWS SECTION
        ========================================== -->

        <section class="reviews-section">

            <div class="container">

                <!-- Section Header -->
                <div class="section-heading text-center">

                    <span class="eyebrow">
                        CUSTOMER FEEDBACK
                    </span>

                    <h1>
                        What People Say
                    </h1>

                    <p>
                        Real reviews from customers on Google.
                    </p>

                </div>


                <!-- =====================================
                     PLACE SUMMARY
                ====================================== -->

                <div
                    id="placeSummary"
                    class="place-summary"
                >

                    <div class="google-badge">
                        <span class="google-g">
                            G
                        </span>
                    </div>

                    <div class="place-info">

                        <h2 id="placeName">
                            Loading...
                        </h2>

                        <p id="placeAddress">
                            Finding KFC...
                        </p>

                    </div>

                    <div class="rating-box">

                        <div class="rating-number">
                            <span id="placeRating">
                                —
                            </span>

                            <span class="rating-star">
                                ★
                            </span>
                        </div>

                        <div
                            id="ratingStars"
                            class="rating-stars"
                        >
                            ★★★★★
                        </div>

                        <div
                            id="reviewCount"
                            class="review-count"
                        >
                            Loading reviews...
                        </div>

                    </div>

                </div>


                <!-- =====================================
                     GOOGLE REVIEWS
                ====================================== -->

                <div
                    id="reviewsContainer"
                    class="reviews-grid"
                >

                    <!-- JavaScript inserts reviews here -->

                    <div class="loading-state">

                        <div
                            class="spinner-border"
                            role="status"
                        ></div>

                        <p>
                            Loading real Google reviews...
                        </p>

                    </div>

                </div>


                <!-- =====================================
                     GOOGLE ATTRIBUTION
                ====================================== -->

                <div class="google-footer">

                    <div class="google-logo-text">
                        <span>G</span>
                        Google
                    </div>

                    <span>
                        Reviews powered by Google
                    </span>

                </div>


                <!-- =====================================
                     GOOGLE MAPS BUTTON
                ====================================== -->

                <div class="text-center mt-4">

                    <a
                        id="googleMapsLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="google-button"
                    >
                        <i class="bi bi-google"></i>

                        View on Google Maps

                        <i class="bi bi-arrow-up-right"></i>
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!--
        Google Maps JavaScript API

        IMPORTANT:
        Replace YOUR_GOOGLE_MAPS_API_KEY
        with your real API key.

        Places API (New) is loaded through
        the Maps JavaScript API.
    -->

    <script
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&v=weekly"
        defer
    ></script>

    <!-- Custom JavaScript -->
    <script src="js/kfc.js"></script>

</body>
</html>
