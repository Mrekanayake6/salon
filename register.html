<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register — Maison Belle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main>
        <section class="auth-wrap">
            <div class="container">
                <div class="auth-panel">
                    <div class="text-center"><a class="brand" href="index.html">Maison Belle<small>BEAUTY
                                STUDIO</small></a><span class="eyebrow d-block mt-5">CUSTOMER ACCOUNT</span>
                        <h1 class="serif display-5 mt-3">Create your account.</h1>
                    </div>
                    <form data-auth="register" class="mt-4" novalidate><label class="form-label">Full name</label><input
                            class="form-control mb-3" required><label class="form-label">Email</label><input
                            type="email" class="form-control mb-3" required><label
                            class="form-label">Phone</label><input class="form-control mb-3" placeholder="0771234567"
                            required><label class="form-label">Password</label>
                        <div class="password-wrap mb-3"><input id="regPassword" type="password" class="form-control"
                                minlength="6" required><button type="button" class="toggle-password"
                                data-target="regPassword"><i class="bi bi-eye"></i></button></div><label
                            class="form-label">Confirm password</label><input type="password" class="form-control mb-4"
                            minlength="6" required><button class="btn btn-luxe w-100">Create account</button>
                        <p class="text-center small mt-4">Already have an account? <a href="login.html">Login</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
