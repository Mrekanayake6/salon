<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — Maison Belle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main>
        <section class="auth-wrap">
            <div class="container">
                <div class="auth-panel">
                    <div class="text-center"><a class="brand" href="index.html">Maison Belle<small>BEAUTY
                                STUDIO</small></a><span class="eyebrow d-block mt-5">CUSTOMER ACCOUNT</span>
                        <h1 class="serif display-5 mt-3">Welcome back.</h1>
                    </div>
                    <form data-auth="login" class="mt-4" novalidate><label class="form-label">Email</label><input
                            type="email" class="form-control mb-3" required><label class="form-label">Password</label>
                        <div class="password-wrap mb-3"><input id="loginPassword" type="password" class="form-control"
                                required><button type="button" class="toggle-password" data-target="loginPassword"><i
                                    class="bi bi-eye"></i></button></div>
                        <div class="d-flex justify-content-between small mb-4"><label><input type="checkbox"
                                    class="me-1"> Remember me</label><a href="#">Forgot password?</a></div><button
                            class="btn btn-luxe w-100">Login</button>
                        <p class="text-center small mt-4">New here? <a href="register.html">Create an account</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
