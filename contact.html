<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact — Maison Belle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main>
        <section class="page-hero">
            <div class="container"><a href="index.html" class="brand">Maison Belle<small>BEAUTY STUDIO</small></a><span
                    class="eyebrow d-block mt-5">COME SAY HELLO</span>
                <h1 class="section-title mt-3">Visit Maison Belle.</h1>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="contact-card">
                            <h3 class="serif fs-2">Address</h3>
                            <p>42 Flower Road<br>Colombo 07, Sri Lanka</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="contact-card">
                            <h3 class="serif fs-2">Call us</h3>
                            <p>+94 77 234 5678<br>+94 11 234 5678</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="contact-card">
                            <h3 class="serif fs-2">Opening hours</h3>
                            <p>Mon — Sat: 09:00 AM — 08:00 PM<br>Sunday: By appointment</p>
                        </div>
                    </div>
                </div>
                <div class="row g-5 mt-2">
                    <div class="col-lg-6">
                        <div class="map-placeholder">Google Maps / Studio location</div>
                    </div>
                    <div class="col-lg-5 ms-auto">
                        <form onsubmit="event.preventDefault();alert('Thank you — we will be in touch shortly.')"><label
                                class="form-label">Name</label><input class="form-control mb-3" required><label
                                class="form-label">Email</label><input type="email" class="form-control mb-3"
                                required><label class="form-label">Phone</label><input class="form-control mb-3"
                                required><label class="form-label">Message</label><textarea class="form-control mb-3"
                                rows="5" required></textarea><button class="btn btn-luxe">Send message</button></form>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
