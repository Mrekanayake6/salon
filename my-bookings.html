<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Bookings — Maison Belle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main>
        <section class="page-hero">
            <div class="container"><a href="index.html" class="brand">Maison Belle<small>BEAUTY STUDIO</small></a><span
                    class="eyebrow d-block mt-5">CUSTOMER ACCOUNT</span>
                <h1 class="section-title mt-3">My bookings.</h1>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div id="bookingList"></div>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { const e = document.getElementById('bookingList'), b = JSON.parse(localStorage.getItem('maisonBelleBooking') || 'null'); if (!b) { e.innerHTML = '<div class="text-center py-5"><h2 class="section-title">Nothing booked yet.</h2><p class="text-muted-custom">When you are ready, choose a service and make time for yourself.</p><a href="booking.html" class="btn btn-luxe">Book an appointment</a></div>'; return } e.innerHTML = '<div class="booking-card"><span class="eyebrow">UPCOMING APPOINTMENT</span><h2 class="serif display-6 mt-3">' + b.service + '</h2><p class="text-muted-custom">' + b.staff + '</p><p>' + new Date(b.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }) + ' · ' + b.time + '</p><span class="status">' + b.status + '</span><div class="mt-4"><button class="btn btn-outline-luxe me-2" onclick="showToast(\'Reschedule demo\')">Reschedule</button><button class="btn btn-outline-luxe" onclick="localStorage.removeItem(\'maisonBelleBooking\');location.reload()">Cancel</button></div></div>' })</script>
</body>

</html>
